# DKMS configuration for the OCSFS v2 kernel module.
# Installed to /usr/src/ocsfs2-<version> by proxmox2/install.sh; DKMS then
# (re)builds ocsfs2.ko automatically for the running kernel and for every future
# kernel upgrade (AUTOINSTALL), as long as the matching kernel headers are present.
PACKAGE_NAME="ocsfs2"
PACKAGE_VERSION="2.0"

# Build via the in-tree Kbuild (obj-m += ocsfs2.o, incl. transport/scsi_pr.o).
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="ocsfs2"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
