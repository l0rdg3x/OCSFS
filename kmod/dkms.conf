# OCSFS — DKMS configuration
# SPDX-License-Identifier: GPL-2.0-only
#
# DKMS (Dynamic Kernel Module Support) automatically rebuilds this
# module when a new kernel version is installed. This is the recommended
# way to deploy OCSFS on Proxmox VE and Debian/Ubuntu systems.
#
# Install:
#   sudo cp -r kmod/ /usr/src/ocsfs-0.1.0/
#   sudo dkms add -m ocsfs -v 0.1.0
#   sudo dkms build -m ocsfs -v 0.1.0
#   sudo dkms install -m ocsfs -v 0.1.0
#
# Or via the Debian package: apt install ocsfs-dkms

PACKAGE_NAME="ocsfs"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="ocsfs"
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"
REMAKE_INITRD="no"

# Build using the out-of-tree Makefile
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
