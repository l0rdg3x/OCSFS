# OCSFS xfstests configuration
# SPDX-License-Identifier: GPL-2.0-only
#
# This is a local.config for xfstests (fstests) to test OCSFS.
#
# Setup:
#   1. Clone xfstests: git clone git://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git
#   2. Build xfstests: cd xfstests-dev && make
#   3. Create test devices:
#        dd if=/dev/zero of=/tmp/ocsfs_test.img bs=1M count=2048
#        dd if=/dev/zero of=/tmp/ocsfs_scratch.img bs=1M count=2048
#        losetup /dev/loop10 /tmp/ocsfs_test.img
#        losetup /dev/loop11 /tmp/ocsfs_scratch.img
#   4. Format test device:
#        mkfs.ocsfs -L test -N 2 -f /dev/loop10
#   5. Copy this file:
#        cp tests/xfstests-ocsfs.conf xfstests-dev/local.config
#   6. Run tests:
#        cd xfstests-dev
#        sudo ./check -g generic/quick
#
# xfstests "generic" tests cover VFS-level semantics that all filesystems
# must pass. OCSFS should pass all generic tests that don't require
# features we haven't implemented (quotas, ACLs, xattrs, etc.).

export FSTYP=ocsfs
export TEST_DEV=/dev/loop10
export TEST_DIR=/mnt/ocsfs-test
export SCRATCH_DEV=/dev/loop11
export SCRATCH_MNT=/mnt/ocsfs-scratch

# mkfs command for xfstests to format scratch device
export MKFS_OPTIONS="-L xfstest -N 2 -f"

# Mount options
export MOUNT_OPTIONS=""

# Tests to exclude (features not yet implemented)
#   - generic/*/quota:     no quota support
#   - generic/*/acl:       no POSIX ACL support
#   - generic/*/xattr:     no extended attributes
#   - generic/*/aio:       limited AIO support
EXCLUDE_TESTS="generic/020 generic/093 generic/097 generic/098"
